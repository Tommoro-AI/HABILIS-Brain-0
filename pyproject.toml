[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "habilis-brain-gcvla"
version = "0.1.0"
description = "GC-VLA and GCRF inference and benchmark evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["gymnasium>=1.0", "numpy>=1.26", "pyyaml>=6.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
inference = [
  "torchvision", "transformers==5.12.1", "tokenizers==0.22.1",
  "huggingface-hub==1.20.1", "omegaconf==2.3.1", "draccus==0.11.6",
  "einops==0.8.1", "pillow==12.0.0", "safetensors==0.8.0",
  "cached-path==1.8.10", "datasets==4.4.1", "rich==13.9.4",
  "accelerate==1.14.0", "torchmetrics==1.9.0", "decord==0.6.0",
  "av==17.1.0", "imageio==2.37.3", "imageio-ffmpeg==0.6.0",
  "termcolor==3.3.0", "tqdm==4.67.1", "packaging", "requests"
]
benchmark = [
  "gymnasium==1.3.0", "numpy==2.2.6", "mujoco==3.8.1", "robosuite==1.4.0",
  "gym==0.26.2", "bddl==1.0.1", "h5py==3.16.0", "easydict==1.13",
  "cloudpickle==3.1.2", "opencv-python==5.0.0.93", "PyOpenGL==3.1.7", "future==1.0.0"
]

[project.scripts]
gcvla = "gcvla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcvla"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "gcvla/_runtime/LICENSE"
"THIRD_PARTY.md" = "gcvla/_runtime/THIRD_PARTY.md"
"LICENSES.md" = "gcvla/_runtime/LICENSES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/gcvla/_runtime"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/gcvla", "LICENSE", "LICENSES.md", "THIRD_PARTY.md", "README.md",
  "pyproject.toml", "requirements-build.txt", "requirements-runtime.txt", "uv.lock",
  "configs/eval_libero.yaml", "configs/eval_libero_pro.yaml",
  "scripts/setup_benchmark.py", "release/benchmarks.json"
]
